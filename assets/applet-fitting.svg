<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Preserve the design proportions</title>
  <desc id="desc">A circular gauge remains round in a wide, square or tall applet container. Uniform fitting leaves space around the artwork rather than distorting or cropping it.</desc>
  <rect width="1000" height="360" rx="20" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" fill="#14293b">
    <text x="32" y="43" font-size="25" font-weight="700">Fit the design without stretching it</text>
    <text x="80" y="87" font-size="18">Wide container</text>
    <text x="463" y="87" font-size="18">Square container</text>
    <text x="800" y="87" font-size="18">Tall container</text>
    <rect x="40" y="146" width="320" height="144" rx="10" fill="#e5edf7" stroke="#a6bbcf" stroke-width="2"/>
    <rect x="440" y="126" width="184" height="184" rx="10" fill="#e5edf7" stroke="#a6bbcf" stroke-width="2"/>
    <rect x="802" y="108" width="130" height="220" rx="10" fill="#e5edf7" stroke="#a6bbcf" stroke-width="2"/>
    <circle cx="200" cy="218" r="58" fill="#14293b"/>
    <circle cx="532" cy="218" r="78" fill="#14293b"/>
    <circle cx="867" cy="218" r="51" fill="#14293b"/>
    <text x="200" y="225" text-anchor="middle" fill="#91e3cb" font-size="23">23.5</text>
    <text x="532" y="227" text-anchor="middle" fill="#91e3cb" font-size="30">23.5</text>
    <text x="867" y="224" text-anchor="middle" fill="#91e3cb" font-size="20">23.5</text>
  </g>
</svg>
