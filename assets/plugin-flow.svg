<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Stream Deck plugin hosting in MATRIC</title>
  <desc id="desc">A client sends a control event to the MATRIC Server. On the Windows PC MATRIC exchanges WebSocket messages with a plugin backend. An optional Property Inspector configures the plugin. Supported Keypad feedback returns to the client.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#72528b"/></marker></defs>
  <rect width="1100" height="420" rx="20" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" fill="#14293b">
    <text x="36" y="48" font-size="26" font-weight="700">Plugin code runs on the PC</text>
    <text x="766" y="48" font-size="18" fill="#72528b">EXPERIMENTAL COMPATIBILITY</text>
    <rect x="345" y="78" width="727" height="306" rx="16" fill="#eae6f2" stroke="#c6b8d5"/>
    <text x="367" y="112" font-size="18" font-weight="700">WINDOWS PC</text>
    <rect x="28" y="158" width="215" height="130" rx="12" fill="#e4f2ed" stroke="#a6cbbc"/>
    <text x="48" y="196" font-size="21" font-weight="700">MATRIC client</text>
    <text x="48" y="230" font-size="17">Press / release</text>
    <text x="48" y="260" font-size="16">Supported feedback</text>
    <rect x="367" y="158" width="210" height="130" rx="12" fill="#14293b"/>
    <text x="387" y="196" font-size="21" font-weight="700" fill="white">MATRIC Server</text>
    <text x="387" y="230" font-size="17" fill="#c7dae9">Deck actions</text>
    <text x="387" y="260" font-size="16" fill="#c7dae9">Plugin settings</text>
    <rect x="731" y="145" width="315" height="80" rx="12" fill="white" stroke="#8b6baa"/>
    <text x="751" y="177" font-size="21" font-weight="700">Plugin backend</text>
    <text x="751" y="204" font-size="17">Node, native or legacy HTML</text>
    <rect x="731" y="278" width="315" height="78" rx="12" fill="white" stroke="#8b6baa"/>
    <text x="751" y="309" font-size="21" font-weight="700">Property Inspector</text>
    <text x="751" y="336" font-size="17">Optional configuration window</text>
    <text x="593" y="156" font-size="16">WebSocket</text>
  </g>
  <g fill="none" stroke="#72528b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M253 222H357"/><path d="M587 185H721"/><path d="M587 264H648V317H721"/>
  </g>
</svg>
