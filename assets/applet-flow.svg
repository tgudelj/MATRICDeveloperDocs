<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Applet state and events</title>
  <desc id="desc">The client host passes parameters, variable snapshots and size to an applet iframe. The applet emits an event. MATRIC executes the action assigned to that event in the saved deck.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#39826f"/></marker></defs>
  <rect width="1100" height="420" rx="20" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" fill="#14293b">
    <text x="36" y="48" font-size="26" font-weight="700">Display state and invoke a configured action</text>
    <rect x="28" y="78" width="760" height="306" rx="16" fill="#e4f2ed" stroke="#a6cbbc"/>
    <text x="50" y="112" font-size="18" font-weight="700">CLIENT DEVICE</text>
    <rect x="50" y="158" width="215" height="130" rx="12" fill="white" stroke="#39826f"/>
    <text x="70" y="196" font-size="21" font-weight="700">Applet iframe</text>
    <text x="70" y="230" font-size="17">Your HTML interface</text>
    <text x="70" y="260" font-size="16">Value display and button</text>
    <rect x="550" y="158" width="210" height="130" rx="12" fill="#14293b"/>
    <text x="571" y="196" font-size="21" font-weight="700" fill="white">MATRIC client</text>
    <text x="571" y="230" font-size="17" fill="#c7dae9">Loaded deck</text>
    <text x="571" y="260" font-size="16" fill="#c7dae9">Applet settings</text>
    <text x="292" y="156" font-size="16">Parameters · variables · size</text>
    <text x="298" y="299" font-size="16">EventName and Data</text>
    <text x="50" y="343" font-size="17">The manifest exposes an event. The deck author assigns its action.</text>
    <rect x="855" y="158" width="217" height="130" rx="12" fill="#e5edf7" stroke="#b2c4d8"/>
    <text x="875" y="196" font-size="21" font-weight="700">MATRIC Server</text>
    <text x="875" y="230" font-size="17">Configured action</text>
    <text x="875" y="260" font-size="16">Runs desktop action</text>
  </g>
  <g fill="none" stroke="#39826f" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M540 186H275"/><path d="M275 264H540"/><path d="M770 222H845"/>
  </g>
</svg>
